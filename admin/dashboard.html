<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JFS Dashboard Kehadiran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <div class="icon">🎬</div>
        <div><h1 class="display">Dashboard Kehadiran</h1><span>Jakarta Film Summit 2026</span></div>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <div class="live"><span class="dot"></span><span id="syncLabel">Sync …</span></div>
        <button class="icon-btn" id="refreshBtn">↻ Refresh</button>
      </div>
    </div>

    <div class="headline">
      <div class="hcard total"><div class="label">👥 Jumlah Terdaftar</div><div class="value" id="valTotal">0</div><div class="sub" id="subTotal">Total peserta yang mendaftar</div></div>
      <div class="hcard hadir"><div class="label">✓ Sudah Absen</div><div class="value" id="valHadir">0</div><div class="sub" id="subHadir">Belum ada data</div></div>
      <div class="hcard miss"><div class="label">✕ Tidak Hadir</div><div class="value" id="valMiss">0</div><div class="sub" id="subMiss">Belum ada data</div></div>
    </div>

    <div class="row">
      <div class="panel">
        <h3>📶 Rasio Kehadiran</h3>
        <div id="donutWrap"></div>
      </div>
      <div class="panel">
        <h3>✓ Absen per Jam</h3>
        <div id="timelineWrap" style="height:180px;"><canvas id="timelineChart"></canvas></div>
      </div>
    </div>

    <div class="panel">
      <h3>🌍 Kehadiran per Negara</h3>
      <div id="instWrap"></div>
    </div>
  </div>

<script src="../assets/"></script>
</body>
</html>
