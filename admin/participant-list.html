<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JFS Daftar Peserta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/participant-list.css">
</head>
<body>
  <div class="shell">
    <div class="print-head" id="printHead">
      <div>
        <h2>Daftar Peserta — Jakarta Film Summit 2026</h2>
        <p id="printDate"></p>
      </div>
      <div class="stats" id="printStats"></div>
    </div>

    <div class="topbar no-print">
      <div class="brand">
        <div class="icon">🎬</div>
        <div><h1 class="display">Daftar Peserta</h1><span>Jakarta Film Summit 2026</span></div>
      </div>
      <button class="export-btn" id="exportPdfBtn">🖨 Export PDF</button>
    </div>

    <div class="controls no-print">
      <div class="search"><input type="text" id="searchInput" placeholder="Cari nama, email, negara, peran, atau ID…" /></div>
      <div class="filters">
        <button class="filter-btn active" data-status="all">Semua</button>
        <button class="filter-btn" data-status="in">Sudah Absen</button>
        <button class="filter-btn" data-status="out">Belum Absen</button>
      </div>
      <select id="countryFilter"><option value="all">Semua Negara</option></select>
    </div>

    <div class="meta-row no-print">
      <span id="metaLabel">Menampilkan 0 dari 0 peserta</span>
      <button id="refreshBtn">↻ Refresh</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr><th>No</th><th>Peserta</th><th>Telepon</th><th>Negara</th><th>Peran</th><th>ID</th><th>Status</th><th>Waktu Absen</th></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div id="emptyState" class="empty hidden">Belum ada peserta yang mendaftar.</div>
    </div>
  </div>

<script src="../assets/js/participant-list.js"></script>
</body>
</html>
